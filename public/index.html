<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description"
    content="Book reviews written entirely by humans. Discover your next favorite book with personalized recommendations and find books similar to the ones you love." />
  <title>Find Your Next Read — Human-Written Book Reviews &amp; Recommendations</title>
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Find Your Next Read" />
  <meta property="og:title" content="Find Your Next Read — Human-Written Book Reviews &amp; Recommendations" />
  <meta property="og:description"
    content="Book reviews written entirely by humans. Discover your next favorite book with personalized recommendations and find books similar to the ones you love." />
  <meta property="og:url" content="https://findyournextread.com/" />
  <link rel="canonical" href="https://findyournextread.com/" />
  <meta property="og:image" content="https://findyournextread.com/og-image.png" />
  <meta property="og:image:width" content="200" />
  <meta property="og:image:height" content="200" />
  <meta property="og:image:alt" content="Find Your Next Read — book reviews written entirely by humans" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Find Your Next Read — Human-Written Book Reviews &amp; Recommendations" />
  <meta name="twitter:description" content="Book reviews written entirely by humans. Discover your next favorite book with personalized recommendations." />
  <meta name="twitter:image" content="https://findyournextread.com/og-image.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://findyournextread.com/#website",
            "url": "https://findyournextread.com/",
            "name": "Find Your Next Read",
            "alternateName": ["FYNR", "Find your next read", "findyournextread.com"],
            "description": "Book reviews written entirely by humans. Discover your next favorite book with personalized recommendations and find books similar to the ones you love.",
            "inLanguage": "en",
            "publisher": { "@id": "https://findyournextread.com/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://findyournextread.com/search?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://findyournextread.com/#organization",
            "name": "Find Your Next Read",
            "alternateName": "FYNR",
            "slogan": "Book reviews written entirely by humans",
            "description": "Book reviews written entirely by humans and personalized book recommendations.",
            "url": "https://findyournextread.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://findyournextread.com/logo512.png",
              "width": 512,
              "height": 512
            }
          }
        ]
      }
    </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root">
    <header>
      <h1>Find Your Next Read</h1>
      <p>
        Find Your Next Read is a book discovery site with book reviews written
        entirely by humans: personalized book recommendations, book of the day
        and books similar to the ones you love.
      </p>
    </header>
    <nav>
      <a href="/">Home</a>
      <a href="/library/">Library — browse all books</a>
      <a href="/pages/about/">About Find Your Next Read</a>
      <a href="/pages/terms/">Terms</a>
      <a href="/pages/privacy/">Privacy</a>
      <a href="/pages/cookies/">Cookie Policy</a>
    </nav>
  </div>
</body>

</html>
